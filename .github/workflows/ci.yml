name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # `contents: write` only for the coverage-badge commit below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A build step alone stays green with a wrong `types` path; the
      # `test -f` is what proves the published package resolves its types.
      - run: npm run build
      - run: test -f dist/index.d.ts
      - run: test -f dist/search.js && test -f dist/search/index.d.ts
      - run: npm run api:check
      - run: npm run size
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
      # The coverage badge is an SVG this job writes from the lcov report the
      # tests just produced: no third-party service, no token. `[skip ci]`
      # keeps the bot commit from starting another run.
      - name: Update the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run coverage:badge
          if [ -n "$(git status --porcelain -- docs/badges/coverage.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/badges/coverage.svg
            git commit -m "Update the coverage badge [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bench
