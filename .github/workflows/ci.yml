name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # `contents: write` only for the coverage-badge commit below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A build step alone stays green with a wrong `types` path; the
      # `test -f` is what proves the published package resolves its types.
      - run: npm run build
      - run: test -f dist/index.d.ts
      - run: test -f dist/search.js && test -f dist/search/index.d.ts
      - run: npm run api:check
      - run: npm run size
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
      # The coverage badge is an SVG this job writes from the lcov report the
      # tests just produced: no third-party service, no token. It goes to the
      # `badges` branch, never to `main`, so the required checks and the
      # protection on `main` never block the bot. `[skip ci]` keeps the bot
      # commit from starting another run.
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/coverage-badge.mjs coverage/lcov.info "$RUNNER_TEMP/coverage.svg"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges > /dev/null; then
            git fetch --depth=1 origin badges
            git worktree add "$RUNNER_TEMP/badges" FETCH_HEAD
          else
            git worktree add --orphan -b badges "$RUNNER_TEMP/badges"
          fi
          cd "$RUNNER_TEMP/badges"
          cp "$RUNNER_TEMP/coverage.svg" coverage.svg
          git add coverage.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update the coverage badge [skip ci]"
            git push origin HEAD:badges
          fi

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bench
