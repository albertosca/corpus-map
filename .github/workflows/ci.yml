name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A build step alone stays green with a wrong `types` path; the
      # `test -f` is what proves the published package resolves its types.
      - run: npm run build
      - run: test -f dist/index.d.ts
      - run: npm run api:check
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bench
