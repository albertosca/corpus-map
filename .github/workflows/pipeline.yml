name: Pipeline

on: [push, pull_request]

jobs:
  arxiv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/arxiv
    steps:
      - uses: actions/checkout@v7
      # astral-sh/setup-uv publishes no floating major-version tag (verified
      # via `git ls-remote --tags`: only full semver, e.g. v10.2.0) — pinned
      # to the latest release instead.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest
