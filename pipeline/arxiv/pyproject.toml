[project]
name = "arxiv-corpus"
version = "0.1.0"
description = "Builds the arXiv computer-science corpus for the corpus-map showcase."
requires-python = ">=3.12,<3.13"
# httpx, not the stdlib urllib: export.arxiv.org's edge blocks urllib's TLS/HTTP fingerprint
# with a reproducible HTTP 406 (verified live on 2026-09-23, see fetch.py's module docstring).
dependencies = ["numpy>=2", "httpx>=0.27,<1"]

[project.optional-dependencies]
# scikit-learn is declared, not just inherited through umap-learn: the cluster stage uses it directly.
model = ["sentence-transformers>=6,<7", "umap-learn>=0.5.12,<0.7", "scikit-learn>=1.5,<2"]
# Only the name and check stages call Claude; the tests use a fake client and never install this.
naming = ["anthropic>=2.3,<3"]

[project.scripts]
arxiv-corpus = "arxiv_corpus.cli:main"

[dependency-groups]
# scikit-learn here too: the cluster tests need the real algorithm and CI runs pytest without extras.
dev = ["ruff>=0.13", "mypy>=1.18", "pytest>=8", "pytest-cov>=6", "scikit-learn>=1.5,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_corpus"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "umap.*", "scipy.*", "sklearn.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=arxiv_corpus --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
