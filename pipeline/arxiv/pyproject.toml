[project]
name = "arxiv-corpus"
version = "0.1.0"
description = "Builds the arXiv computer-science corpus for the corpus-map showcase."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2"]

[project.optional-dependencies]
model = ["sentence-transformers>=6,<7", "umap-learn>=0.5.12,<0.6"]

[project.scripts]
arxiv-corpus = "arxiv_corpus.cli:main"

[dependency-groups]
dev = ["ruff>=0.13", "mypy>=1.18", "pytest>=8", "pytest-cov>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_corpus"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "umap.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=arxiv_corpus --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
